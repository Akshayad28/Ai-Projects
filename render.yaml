services:
  - type: web
    name: shopbuddy-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_API_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: SEARCH_PROVIDER_API_KEY
        sync: false
      - key: BESTBUY_API_KEY
        sync: false
      - key: EBAY_CLIENT_ID
        sync: false
      - key: EBAY_CLIENT_SECRET
        sync: false
      - key: AMAZON_PAAPI_ACCESS_KEY
        sync: false
      - key: AMAZON_PAAPI_SECRET_KEY
        sync: false
      - key: AMAZON_PAAPI_PARTNER_TAG
        sync: false
      - key: FLIPKART_AFFILIATE_ID
        sync: false
      - key: FLIPKART_AFFILIATE_TOKEN
        sync: false
