<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Google Search Result - Custom New Layout</title>
</head>
<body>
  <div class="custom-experimental-feed">
    <div class="custom-card-wrapper" itemscope itemtype="http://schema.org/Product">
      <img src="https://example.com/keyboard.jpg" alt="Mechanical Keyboard">
      <h3 itemprop="name">Keychron K2 Wireless Mechanical Keyboard Version 2</h3>
      <div itemprop="offers" itemscope itemtype="http://schema.org/Offer">
        <span itemprop="price">₹7,499</span>
        <span itemprop="seller">Keychron India</span>
      </div>
      <a href="https://keychron.in/product/k2-v2">Buy Online</a>
    </div>

    <div class="custom-card-wrapper" itemscope itemtype="http://schema.org/Product">
      <img src="https://example.com/mouse.jpg" alt="Logitech MX Master 3S">
      <h3 itemprop="name">Logitech MX Master 3S Performance Wireless Mouse</h3>
      <div itemprop="offers" itemscope itemtype="http://schema.org/Offer">
        <span itemprop="price">₹8,995</span>
        <span itemprop="seller">Amazon India</span>
      </div>
      <a href="https://www.amazon.in/dp/B09HM94VDS">Buy Online</a>
    </div>
  </div>
</body>
</html>
